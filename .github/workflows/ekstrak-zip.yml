name: Ekstrak Zip

# Setiap file .zip diekstrak ke FOLDER TEMPAT ZIP ITU BERADA, lalu zip-nya dihapus.
#   mode-l/juz-2.zip  -> hasil masuk ke mode-l/
#   mode-p/juz-2.zip  -> hasil masuk ke mode-p/
#   zip di root repo  -> hasil masuk ke root repo
# Kalau di dalam zip ada folder teratas dengan nama yang sama dengan folder zip
# (mis. mode-l/ di dalam mode-l/juz-2.zip), folder itu tidak digandakan.
# Jalan otomatis saat ada zip yang di-push, atau manual lewat Run workflow.

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ekstrak-zip
  cancel-in-progress: false

jobs:
  ekstrak:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Ekstrak tiap zip ke foldernya masing-masing
        run: |
          mapfile -d '' zips < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0 | sort -z)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Tidak ada zip di repo"
            exit 0
          fi
          for z in "${zips[@]}"; do
            dir=$(dirname "$z")
            base=$(basename "$dir")
            echo "Mengekstrak: $z -> $dir/"
            tmp=$(mktemp -d)
            if unzip -o -q "$z" -x '__MACOSX/*' '*/.DS_Store' '.DS_Store' -d "$tmp"; then
              if [ "$dir" != "." ] && [ -d "$tmp/$base" ]; then
                cp -a "$tmp/$base/." "$dir/"
                rm -rf "$tmp/$base"
              fi
              cp -a "$tmp/." "$dir/"
              git rm -q -f -- "$z"
            else
              echo "GAGAL: $z (zip dibiarkan)"
            fi
            rm -rf "$tmp"
          done

      - name: Commit hasil ekstrak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
            exit 0
          fi
          git commit -q -m "Ekstrak zip otomatis [skip ci]"
          git pull --rebase -q || true
          git push
