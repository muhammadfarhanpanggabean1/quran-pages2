name: Ekstrak Zip

# Semua file .zip di repo (folder mana pun, termasuk mode-l/ dan mode-p/)
# diekstrak ke root repo dengan struktur folder di dalam zip dipertahankan,
# lalu file zip-nya dihapus.
# Jalan otomatis saat ada zip yang di-push, atau manual lewat Run workflow.

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ekstrak-zip
  cancel-in-progress: false

jobs:
  ekstrak:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Ekstrak semua zip di repo
        run: |
          mapfile -d '' zips < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0 | sort -z)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Tidak ada zip di repo"
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Mengekstrak: $z"
            unzip -o -q "$z" -x '__MACOSX/*' '*/.DS_Store' '.DS_Store' -d . || echo "GAGAL: $z"
            git rm -q -f -- "$z"
          done

      - name: Commit hasil ekstrak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
            exit 0
          fi
          git commit -q -m "Ekstrak zip otomatis [skip ci]"
          git pull --rebase -q || true
          git push
